name: Sync Android release

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: check-android-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.COZIE_SITE_URL || 'https://cozie.pages.dev' }}
      GITHUB_TOKEN: ${{ github.token }}
      SYNC_ANDROID_RELEASE: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Reconcile latest APK and request deployment when needed
        run: node scripts/check-android-release.mjs
