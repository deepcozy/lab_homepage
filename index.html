<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdfaf9" />
    <meta name="description" content="Meet Cozie. A little company for your parenting days." />
    <title>Cozie — A little company for your parenting days</title>
    <script src="./download-platform.js"></script>
    <link rel="preload" href="./assets/fonts/Outfit-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero" aria-labelledby="hero-title">
      <header class="brand" aria-label="Cozie">cozie</header>

      <section class="intro">
        <h1 id="hero-title">Hi, I’m Cozie.</h1>
        <p>A little company for your parenting days.</p>
      </section>

      <section class="scan" aria-labelledby="scan-title">
        <p id="scan-title">Scan to meet Cozie.</p>
        <div class="scan__options">
          <div class="download-card" data-platform="android">
            <a class="scan__slot" href="/download/android" aria-label="Download Cozie for Android">
              <div class="scan__code" aria-hidden="true">
                <img class="scan__qr" src="./assets/android-download-qr.svg" alt="" width="256" height="256" />
                <img class="scan__corners" src="./assets/qr-corners.svg" alt="" width="187.258" height="185.081" />
              </div>
            </a>
            <div class="download-card__details">
              <p class="download-card__platform"><span class="download-card__mobile-label">Get Cozie for</span>Android</p>
              <a class="download-card__button" href="/download/android" aria-label="Download Cozie for Android">Download APK</a>
            </div>
          </div>
          <div class="download-card" data-platform="ios">
            <a class="scan__slot" href="https://testflight.apple.com/join/51gqyeCn" aria-label="Get Cozie for iOS on TestFlight">
              <div class="scan__code" aria-hidden="true">
                <img class="scan__qr" src="./assets/ios-download-qr.svg" alt="" width="256" height="256" />
                <img class="scan__corners" src="./assets/qr-corners.svg" alt="" width="187.258" height="185.081" />
              </div>
            </a>
            <div class="download-card__details">
              <p class="download-card__platform"><span class="download-card__mobile-label">Get Cozie for</span>iOS <span class="download-card__note">TestFlight</span></p>
              <a class="download-card__button" href="https://testflight.apple.com/join/51gqyeCn" aria-label="Get Cozie for iOS on TestFlight">Open TestFlight</a>
            </div>
          </div>
        </div>
      </section>

      <img
        class="hero__art"
        src="./assets/cozie-cloud.png"
        width="1376"
        height="1143"
        alt="Cozie, a fluffy pink cloud companion with bright blue eyes."
        fetchpriority="high"
        decoding="async"
      />
    </main>
  </body>
</html>
